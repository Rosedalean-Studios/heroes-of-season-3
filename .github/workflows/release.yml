name: Release pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Export and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(python3 -c 'import json; print(json.load(open("pakku.json"))["version"])')
          if [[ -z "$version" ]] || ! git check-ref-format "refs/tags/$version"; then
            echo "pakku.json must contain a non-empty valid release tag" >&2
            exit 1
          fi

          target_sha=$(git rev-parse HEAD)
          if ! remote_tags=$(git ls-remote --tags origin "refs/tags/$version" "refs/tags/$version^{}"); then
            echo "Could not check whether tag $version exists" >&2
            exit 1
          fi
          if [[ -n "$remote_tags" ]]; then
            echo "Tag $version already exists; refusing to overwrite the release" >&2
            exit 1
          fi

          curl --fail --location --silent --show-error \
            https://github.com/juraj-hrivnak/Pakku/releases/download/v1.5.0/pakku.jar \
            --output pakku.jar
          echo '4fdbd8423698b59d19d71195dcde1b65da6432b6d67ea38fc74aefd9062aa201  pakku.jar' | sha256sum --check --status

          java -jar pakku.jar export

          shopt -s nullglob
          files=(build/modrinth/*.mrpack)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected one Modrinth export in build/modrinth; found ${#files[@]}" >&2
            exit 1
          fi

          gh release create "$version" "${files[0]}" \
            --target "$target_sha" \
            --generate-notes
